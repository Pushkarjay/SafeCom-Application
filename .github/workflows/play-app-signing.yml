name: Play App Signing Diagnostic
on: workflow_dispatch
jobs:
  check-signing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Get signing SHA-1
        continue-on-error: true
        run: |
          for PKG in com.safecom.customer com.safecom.employee; do
            echo "=== $PKG ==="
            gcloud androidpublisher edits create --package-name "$PKG" 2>/dev/null
          done
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: List Firebase SHA-1s
        run: |
          gcloud firebase android apps list --project=safecom-application-01
