name: Rollback Backend

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to rollback to (e.g. git SHA)
        type: string
        required: true
      region:
        description: Region to rollback (or 'all' for both)
        type: choice
        default: all
        options:
          - all
          - us-central1
          - asia-south1

env:
  PROJECT_ID: safecom-application-01
  SERVICE_NAME: safecom-backend
  REGION_1: us-central1
  REGION_2: asia-south1

jobs:
  rollback:
    name: Rollback to ${{ github.event.inputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Rollback us-central1
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'us-central1'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.event.inputs.image_tag }} \
            --region ${{ env.REGION_1 }} \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }}

      - name: Rollback asia-south1
        if: github.event.inputs.region == 'all' || github.event.inputs.region == 'asia-south1'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.event.inputs.image_tag }} \
            --region ${{ env.REGION_2 }} \
            --allow-unauthenticated \
            --project ${{ env.PROJECT_ID }}
