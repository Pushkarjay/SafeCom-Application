name: Build Mobile Apps

on:
  push:
    branches: [main]
    paths:
      - 'mobile_customer/**'
      - 'mobile_employee/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:
    inputs:
      bump_version:
        description: Auto-increment build number
        type: boolean
        default: true
      upload_play_store:
        description: Upload to Google Play Store
        type: boolean
        default: false
      upload_employee:
        description: Also upload Employee app to Play Store (set false for customer-only rollout)
        type: boolean
        default: true
      release_tracks:
        description: Comma-separated Play Store tracks for the Customer app (e.g. internal,alpha,production)
        type: string
        default: internal
      employee_release_track:
        description: Play Store track for the Employee app (when upload_employee=true)
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

env:
  CUSTOMER_PACKAGE: com.safecom.customer
  EMPLOYEE_PACKAGE: com.safecom.employee
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-customer:
    name: Build Customer App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_customer

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Cache Flutter pub cache
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-customer-${{ runner.os }}-${{ hashFiles('mobile_customer/pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-customer-${{ runner.os }}-${{ hashFiles('mobile_customer/android/*.gradle*', 'mobile_customer/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Decode keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.SAFECOM_KEYSTORE }}" | base64 -d > "$HOME/.android/safecom-keystore.jks"
        shell: bash

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.SAFECOM_CUSTOMER_GOOGLE_SERVICES }}" | base64 -d > android/app/google-services.json
        shell: bash

      - name: Decode strings.xml
        run: |
          echo "${{ secrets.SAFECOM_CUSTOMER_STRINGS_XML }}" | base64 -d > android/app/src/main/res/values/strings.xml
        shell: bash

      - name: Bump build number
        if: github.event_name == 'workflow_dispatch' && inputs.bump_version
        run: |
          LINE=$(grep '^version: ' pubspec.yaml)
          VER=$(echo "$LINE" | sed 's/version: //')
          NAME=$(echo "$VER" | cut -d+ -f1)
          BUILD=$(echo "$VER" | cut -d+ -f2)
          NEXT=$((BUILD + 1))
          sed -i "s/^version: .*/version: ${NAME}+${NEXT}/" pubspec.yaml

      - name: Commit version bump
        if: github.event_name == 'workflow_dispatch' && inputs.bump_version
        run: |
          git config user.name "SafeCom CI"
          git config user.email "ci@safecom.in"
          git add pubspec.yaml
          git commit -m "chore: bump customer build to $(grep '^version: ' pubspec.yaml | sed 's/version: //') [skip ci]"
          git pull --rebase origin main
          git push

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: ORG_GRADLE_PROJECT_SAFECOM_KEYSTORE="$HOME/.android/safecom-keystore.jks" flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_SAFECOM_KEYSTORE_PASSWORD: ${{ secrets.SAFECOM_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SAFECOM_KEY_ALIAS: ${{ secrets.SAFECOM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SAFECOM_KEY_PASSWORD: ${{ secrets.SAFECOM_KEY_PASSWORD }}

      - name: Build AAB
        run: ORG_GRADLE_PROJECT_SAFECOM_KEYSTORE="$HOME/.android/safecom-keystore.jks" flutter build appbundle --release
        env:
          ORG_GRADLE_PROJECT_SAFECOM_KEYSTORE_PASSWORD: ${{ secrets.SAFECOM_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SAFECOM_KEY_ALIAS: ${{ secrets.SAFECOM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SAFECOM_KEY_PASSWORD: ${{ secrets.SAFECOM_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: customer-app
          path: |
            mobile_customer/build/app/outputs/flutter-apk/app-release.apk
            mobile_customer/build/app/outputs/bundle/release/app-release.aab

  build-employee:
    name: Build Employee App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_employee

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest

      - name: Cache Flutter pub cache
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-employee-${{ runner.os }}-${{ hashFiles('mobile_employee/pubspec.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-employee-${{ runner.os }}-${{ hashFiles('mobile_employee/android/*.gradle*', 'mobile_employee/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Decode keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.SAFECOM_KEYSTORE }}" | base64 -d > "$HOME/.android/safecom-keystore.jks"
        shell: bash

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.SAFECOM_EMPLOYEE_GOOGLE_SERVICES }}" | base64 -d > android/app/google-services.json
        shell: bash

      - name: Decode strings.xml
        run: |
          echo "${{ secrets.SAFECOM_EMPLOYEE_STRINGS_XML }}" | base64 -d > android/app/src/main/res/values/strings.xml
        shell: bash

      - name: Bump build number
        if: github.event_name == 'workflow_dispatch' && inputs.bump_version
        run: |
          LINE=$(grep '^version: ' pubspec.yaml)
          VER=$(echo "$LINE" | sed 's/version: //')
          NAME=$(echo "$VER" | cut -d+ -f1)
          BUILD=$(echo "$VER" | cut -d+ -f2)
          NEXT=$((BUILD + 1))
          sed -i "s/^version: .*/version: ${NAME}+${NEXT}/" pubspec.yaml
          git config user.name "SafeCom CI"
          git config user.email "ci@safecom.in"
          git add pubspec.yaml
          git commit -m "chore: bump employee build to ${NAME}+${NEXT} [skip ci]"
          git pull --rebase origin main
          git push

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: ORG_GRADLE_PROJECT_SAFECOM_KEYSTORE="$HOME/.android/safecom-keystore.jks" flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_SAFECOM_KEYSTORE_PASSWORD: ${{ secrets.SAFECOM_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SAFECOM_KEY_ALIAS: ${{ secrets.SAFECOM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SAFECOM_KEY_PASSWORD: ${{ secrets.SAFECOM_KEY_PASSWORD }}

      - name: Build AAB
        run: ORG_GRADLE_PROJECT_SAFECOM_KEYSTORE="$HOME/.android/safecom-keystore.jks" flutter build appbundle --release
        env:
          ORG_GRADLE_PROJECT_SAFECOM_KEYSTORE_PASSWORD: ${{ secrets.SAFECOM_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SAFECOM_KEY_ALIAS: ${{ secrets.SAFECOM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SAFECOM_KEY_PASSWORD: ${{ secrets.SAFECOM_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: employee-app
          path: |
            mobile_employee/build/app/outputs/flutter-apk/app-release.apk
            mobile_employee/build/app/outputs/bundle/release/app-release.aab

  upload-play-store:
    name: Upload to Play Store
    needs: [build-customer, build-employee]
    if: github.event_name == 'workflow_dispatch' && inputs.upload_play_store
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: customer-app
          path: artifacts/customer

      - uses: actions/download-artifact@v4
        with:
          name: employee-app
          path: artifacts/employee

      # --- Customer app: upload to each requested track (full rollout) ---
      - name: Upload Customer to Internal
        uses: r0adkll/upload-google-play@v1
        if: contains(inputs.release_tracks, 'internal')
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: ${{ env.CUSTOMER_PACKAGE }}
          releaseFiles: artifacts/customer/**/*.aab
          track: internal
          status: completed

      - name: Upload Customer to Alpha
        uses: r0adkll/upload-google-play@v1
        if: contains(inputs.release_tracks, 'alpha')
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: ${{ env.CUSTOMER_PACKAGE }}
          releaseFiles: artifacts/customer/**/*.aab
          track: alpha
          status: completed

      - name: Upload Customer to Beta
        uses: r0adkll/upload-google-play@v1
        if: contains(inputs.release_tracks, 'beta')
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: ${{ env.CUSTOMER_PACKAGE }}
          releaseFiles: artifacts/customer/**/*.aab
          track: beta
          status: completed

      - name: Upload Customer to Production
        uses: r0adkll/upload-google-play@v1
        if: contains(inputs.release_tracks, 'production')
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: ${{ env.CUSTOMER_PACKAGE }}
          releaseFiles: artifacts/customer/**/*.aab
          track: production
          status: completed

      # --- Employee app: optional single-track upload ---
      - uses: r0adkll/upload-google-play@v1
        if: inputs.upload_employee
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: ${{ env.EMPLOYEE_PACKAGE }}
          releaseFiles: artifacts/employee/**/*.aab
          track: ${{ inputs.employee_release_track }}
          status: completed
