name: Deploy Customer Landing

on:
  push:
    branches: [main]
    paths:
      - 'customer_landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

env:
  PROJECT_ID: safecom-application-01
  HOSTING_SITE: safecom-customer

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Firebase Hosting
        run: |
          SA_EMAIL=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          echo "Authenticated as: $SA_EMAIL"
          echo "Deploying site: ${{ env.HOSTING_SITE }}"
          npx firebase-tools@13 deploy --only hosting:${{ env.HOSTING_SITE }} --project ${{ env.PROJECT_ID }}
