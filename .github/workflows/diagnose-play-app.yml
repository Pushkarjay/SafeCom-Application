name: Diagnose Play App

on:
  workflow_dispatch:
    inputs:
      app:
        type: choice
        default: employee
        options: [customer, employee]
      promote_track:
        description: Promote the latest internal release to this track (empty = diagnose only)
        type: choice
        default: ''
        options: ['', alpha, beta, production]
      promote_version_code:
        description: Explicit version code to promote (defaults to latest internal release)
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install googleapis
      - run: node scripts/diagnose-play-app.js
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          APP: ${{ inputs.app }}
      - name: Promote release
        if: inputs.promote_track != ''
        run: node scripts/promote-play-release.js
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          APP: ${{ inputs.app }}
          PROMOTE_TRACK: ${{ inputs.promote_track }}
          PROMOTE_VERSION_CODE: ${{ inputs.promote_version_code }}
