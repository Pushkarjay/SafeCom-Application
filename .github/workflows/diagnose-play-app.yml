name: Diagnose Play App

on:
  workflow_dispatch:
    inputs:
      app:
        type: choice
        default: employee
        options: [customer, employee]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install googleapis
      - run: node scripts/diagnose-play-app.js
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          APP: ${{ inputs.app }}
