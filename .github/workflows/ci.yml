name: CI Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-backend:
    name: Lint & TypeCheck Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend_server/package-lock.json
      - run: npm ci
      - run: npm run build

  lint-admin:
    name: Lint & Build Admin Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin/web_app/admin-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Admin/web_app/admin-dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build

  analyze-customer:
    name: Analyze Customer App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  analyze-employee:
    name: Analyze Employee App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_employee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test-customer:
    name: Test Customer App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
      - run: flutter pub get
      - run: flutter test

  test-employee:
    name: Test Employee App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_employee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
      - run: flutter pub get
      - run: flutter test

  docker-build-backend:
    name: Verify Backend Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t safecom-backend backend_server/
