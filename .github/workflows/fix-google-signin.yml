name: Fix Google Sign-In
on:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  get-play-cert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_signing_sha1: ${{ steps.get-sha.outputs.app_signing_sha1 }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}

      - id: get-sha
        run: |
          TOKEN=$(gcloud auth print-access-token)

          for PACKAGE in "com.safecom.customer" "com.safecom.employee"; do
            echo "=== $PACKAGE ==="
            EDIT=$(curl -s -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits" \
              -d '{}')
            echo "Edit response: $EDIT"
            EDIT_ID=$(echo "$EDIT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
            echo "Edit ID: $EDIT_ID"

            if [ -n "$EDIT_ID" ]; then
              for VC in $(curl -s -H "Authorization: Bearer $TOKEN" \
                "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID/bundles" | \
                python3 -c "import sys,json; [print(b.get('versionCode','')) for b in json.load(sys.stdin).get('bundles',[])]" 2>/dev/null); do
                echo "Getting generated APK for version $VC"
                curl -s -H "Authorization: Bearer $TOKEN" \
                  "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/generatedApks/$VC"
                echo ""
              done

              EDIT_DETAILS=$(curl -s -H "Authorization: Bearer $TOKEN" \
                "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID")
              echo "Edit details: $EDIT_DETAILS"

              curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
                "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID" > /dev/null
            fi
          done

          echo "app_signing_sha1=check_logs_above" >> "$GITHUB_OUTPUT"

  add-to-firebase:
    runs-on: ubuntu-latest
    needs: get-play-cert
    permissions:
      contents: read
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: List current Firebase SHA-1s
        run: |
          TOKEN=$(gcloud auth print-access-token)
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://firebase.googleapis.com/v1beta1/projects/safecom-application-01/androidApps" | python3 -m json.tool