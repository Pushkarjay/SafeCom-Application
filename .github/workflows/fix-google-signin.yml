name: Fix Google Sign-In
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  add-sha:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: auth-play
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}

      - name: Get Play App Signing SHA-1 and add to Firebase
        run: |
          TOKEN=$(gcloud auth print-access-token)

          for PACKAGE in "com.safecom.customer" "com.safecom.employee"; do
            echo "=== $PACKAGE ==="

            EDIT=$(curl -s -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits" \
              -d '{}')
            EDIT_ID=$(echo "$EDIT" | python3 -c "
import sys,json
d=json.load(sys.stdin)
print(d.get('id',''))
" 2>/dev/null)
            echo "Edit ID: $EDIT_ID"

            if [ -n "$EDIT_ID" ]; then
              BUNDLES=$(curl -s -H "Authorization: Bearer $TOKEN" \
                "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID/bundles")
              echo "Bundles: $BUNDLES"

              VERSIONS=$(echo "$BUNDLES" | python3 -c "
import sys,json
try:
    d=json.load(sys.stdin)
    for b in d.get('bundles',[]):
        print(b.get('versionCode',''))
except: pass
" 2>/dev/null)

              for VC in $VERSIONS; do
                echo "Version code: $VC"
                GEN=$(curl -s -H "Authorization: Bearer $TOKEN" \
                  "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/generatedApks/$VC")
                echo "Generated APK info: $GEN"
              done

              curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
                "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID" > /dev/null
            fi
          done

      - id: auth-firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Add Play Signing SHA-1 to Firebase
        run: |
          TOKEN=$(gcloud auth print-access-token)
          echo "Current SHA-1s:"
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://firebase.googleapis.com/v1beta1/projects/safecom-application-01/androidApps" | python3 -m json.tool