name: Deploy Admin Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'Admin/web_app/admin-dashboard/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

env:
  PROJECT_ID: safecom-application-01
  HOSTING_SITE: safecom-application-01
  ADMIN_DIR: Admin/web_app/admin-dashboard

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.ADMIN_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.ADMIN_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ env.PROJECT_ID }}
          target: ${{ env.HOSTING_SITE }}
