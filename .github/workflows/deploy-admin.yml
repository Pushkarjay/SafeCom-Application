name: Deploy Admin Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'Admin/web_app/admin-dashboard/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

env:
  PROJECT_ID: safecom-application-01
  HOSTING_SITE: safecom-application-01
  ADMIN_DIR: Admin/web_app/admin-dashboard

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.ADMIN_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.ADMIN_DIR }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.ADMIN_DIR }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@13 deploy --only hosting:${{ env.HOSTING_SITE }} --project ${{ env.PROJECT_ID }}
