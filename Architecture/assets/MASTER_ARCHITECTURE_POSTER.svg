  <text x="650" y="882" text-anchor="middle" fill="white" class="sublabel">Components: 4 | Routes: 17 | Services: 8 | Collections: 9</text>
  <text x="1150" y="882" text-anchor="middle" fill="white" class="sublabel">Generated: 2026-05-09</text>
