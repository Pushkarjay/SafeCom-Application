<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', sans-serif; font-size: 32px; font-weight: bold; fill: #0f172a; }
