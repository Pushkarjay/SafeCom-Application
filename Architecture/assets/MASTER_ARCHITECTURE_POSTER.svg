      .label { font-family: 'Segoe UI', sans-serif; font-size: 14px; fill: #1e293b; }
      .sublabel { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #64748b; }
      .box { stroke: #334155; stroke-width: 2px; }
      .arrow { stroke: #6b7280; stroke-width: 2px; fill: none; marker-end: url(#arrowhead); }
      .mobile { fill: #4285f4; }
      .web { fill: #34a853; }
      .backend { fill: #ea4335; }
      .firebase { fill: #fbbc04; }
      .external { fill: #607d8b; }
      .shared { fill: #9c27b0; }
      .user { fill: #9e9e9e; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect width="1600" height="60" fill="#0f172a"/>
