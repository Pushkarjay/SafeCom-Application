  <text x="300" y="320" text-anchor="middle" fill="white" class="sublabel">Flutter/Riverpod</text>
  <text x="300" y="340" text-anchor="middle" fill="white" class="sublabel">Job Management</text>
  <text x="300" y="360" text-anchor="middle" fill="white" class="sublabel">Location Services</text>

