  <text x="140" y="320" text-anchor="middle" fill="white" class="sublabel">Flutter/Riverpod</text>
  <text x="140" y="340" text-anchor="middle" fill="white" class="sublabel">GoRouter Navigation</text>
  <text x="140" y="360" text-anchor="middle" fill="white" class="sublabel">SDUI Renderer</text>

