<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; }
      .label { font-family: sans-serif; font-size: 11px; fill: #1e293b; }
      .sublabel { font-family: sans-serif; font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1000" height="600" fill="#f8fafc"/>
  <text x="500" y="35" text-anchor="middle" class="title">SafeCom - Authentication Flow Sequence</text>

  <!-- User -->
  <rect x="30" y="80" width="120" height="60" rx="6" fill="#9e9e9e"/>
  <text x="90" y="115" text-anchor="middle" fill="white" font-weight="bold">User</text>

  <!-- Mobile App -->
  <rect x="250" y="80" width="120" height="60" rx="6" fill="#4285f4"/>
  <text x="310" y="115" text-anchor="middle" fill="white" font-weight="bold">Mobile App</text>

  <!-- Firebase Auth -->
  <rect x="470" y="80" width="120" height="60" rx="6" fill="#fbbc04"/>
  <text x="530" y="115" text-anchor="middle" fill="#000" font-weight="bold">Firebase</text>

  <!-- Backend -->
  <rect x="690" y="80" width="120" height="60" rx="6" fill="#ea4335"/>
  <text x="750" y="115" text-anchor="middle" fill="white" font-weight="bold">Backend</text>

  <!-- Firestore -->
  <rect x="870" y="80" width="120" height="60" rx="6" fill="#fbbc04"/>
  <text x="930" y="115" text-anchor="middle" fill="#000" font-weight="bold">Firestore</text>

  <!-- Step 1 -->
  <line x1="90" y1="140" x2="310" y2="140" stroke="#6b7280" stroke-width="2"/>
  <polygon points="310,140 300,135 300,145" fill="#6b7280"/>
  <text x="200" y="135" class="label">1. Enter credentials</text>

  <!-- Step 2 -->
  <line x1="310" y1="170" x2="530" y2="170" stroke="#6b7280" stroke-width="2"/>
  <polygon points="530,170 520,165 520,175" fill="#6b7280"/>
  <text x="420" y="165" class="label">2. Authenticate (phone/email)</text>

  <!-- Firebase processing -->
  <rect x="440" y="200" width="120" height="30" rx="4" fill="#f1f5f9"/>
  <text x="530" y="220" text-anchor="middle" class="sublabel">Verify credentials</text>
  <rect x="440" y="235" width="120" height="30" rx="4" fill="#f1f5f9"/>
  <text x="530" y="255" text-anchor="middle" class="sublabel">Generate ID Token</text>

  <!-- Step 3 - Token to App -->
  <line x1="530" y1="290" x2="310" y2="290" stroke="#6b7280" stroke-width="2"/>
  <polygon points="310,290 320,285 320,295" fill="#6b7280"/>
  <text x="420" y="285" class="label">3. Return Firebase ID Token</text>

  <!-- Step 4 - API Request -->
  <line x1="310" y1="320" x2="750" y2="320" stroke="#6b7280" stroke-width="2"/>
  <polygon points="750,320 740,315 740,325" fill="#6b7280"/>
  <text x="530" y="315" class="label">4. API request + Bearer token</text>

  <!-- Backend verification -->
  <rect x="650" y="350" width="200" height="50" rx="4" fill="#fff" stroke="#fbbc04"/>
  <text x="750" y="370" text-anchor="middle" class="label" font-weight="bold">verifyIdToken(token)</text>
  <text x="750" y="385" text-anchor="middle" class="sublabel">Decode JWT, extract uid</text>

  <!-- Step 5 - Role Check -->
  <line x1="750" y1="420" x2="930" y2="420" stroke="#6b7280" stroke-width="2"/>
  <polygon points="930,420 920,415 920,425" fill="#6b7280"/>
  <text x="840" y="415" class="label">5. Query role by firebaseUid</text>

  <!-- Firestore query -->
  <rect x="850" y="450" width="140" height="40" rx="4" fill="#fff" stroke="#fbbc04"/>
  <text x="920" y="475" text-anchor="middle" class="sublabel">admins/employees/customers</text>

  <!-- Step 6 - Response -->
  <line x1="930" y1="510" x2="750" y2="510" stroke="#6b7280" stroke-width="2"/>
  <polygon points="750,510 760,505 760,515" fill="#6b7280"/>
  <text x="840" y="505" class="label">6. Return user profile with role</text>

  <!-- Step 7 - Final Response -->
  <line x1="750" y1="540" x2="310" y2="540" stroke="#6b7280" stroke-width="2"/>
  <polygon points="310,540 320,535 320,545" fill="#6b7280"/>
  <text x="530" y="535" class="label">7. 200 OK + Data</text>

  <!-- Legend -->
  <rect x="50" y="550" width="400" height="40" rx="4" fill="#f1f5f9"/>
  <text x="70" y="575" class="sublabel">Token format: Authorization: Bearer eyJ...</text>

  <!-- Time indication -->
  <text x="950" y="550" class="sublabel">Sync flow</text>
</svg>